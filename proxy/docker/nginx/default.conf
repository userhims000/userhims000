# jackbot.nl
server {
    server_name jackbot.nl.devbox;

	location / {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://10.1.1.11:80;
	}

	 location /phpmyadmin {
        rewrite /phpmyadmin$ /phpmyadmin/ permanent;
        rewrite /phpmyadmin/(.*) /$1 break;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://10.1.1.12:80;
    }

    location /rabbitmqadmin {
        rewrite /rabbitmqadmin$ /rabbitmqadmin/ permanent;
        rewrite /rabbitmqadmin/(.*) /$1 break;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://10.1.1.13:15672;
    }
}

