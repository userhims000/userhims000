version: '3.7'

services:
  nginx:
    image: nginx:1.19.3
    hostname: nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    networks:
      nginxproxy:
        ipv4_address: 10.1.1.2

networks:
  nginxproxy:
    ipam:
      config:
        - subnet: 10.1.0.0/20
